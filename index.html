<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure ESP32 Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style> 
        #map { height: 400px; width: 100%; border-radius: 0.5rem; z-index: 1; } 
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 flex flex-col items-center justify-center">

    <div id="login-screen" class="w-full max-w-md bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-lg text-center">
        <h2 class="text-3xl font-bold text-yellow-400 mb-2">Secure Telemetry</h2>
        <p class="text-gray-400 mb-6">Please log in to view GPS data.</p>
        
        <input type="email" id="email" placeholder="Email Address" class="w-full p-3 mb-4 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">
        <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">
        
        <button onclick="attemptLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition">Login</button>
        <p id="login-error" class="text-red-400 mt-4 text-sm hidden">Invalid email or password.</p>
    </div>

    <div id="dashboard-screen" class="w-full max-w-6xl hidden flex-col items-center">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-yellow-400">ESP32 Live Telemetry</h1>
            <p class="text-gray-400 mt-2">Private & Secure</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-8 w-full">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-sm font-medium text-gray-400 uppercase">Voltage</h2>
                <p id="voltage-display" class="text-3xl font-bold text-green-400 mt-2">--.- V</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-sm font-medium text-gray-400 uppercase">Latitude</h2>
                <p id="lat-display" class="text-2xl font-bold text-blue-400 mt-3">--.------</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-sm font-medium text-gray-400 uppercase">Longitude</h2>
                <p id="lng-display" class="text-2xl font-bold text-blue-400 mt-3">--.------</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-sm font-medium text-gray-400 uppercase">Total Presses</h2>
                <p id="count-display" class="text-3xl font-bold text-purple-400 mt-2">0</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-sm font-medium text-gray-400 uppercase">Satellites</h2>
                <p id="sat-display" class="text-3xl font-bold text-yellow-400 mt-2">0</p>
            </div>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg w-full">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Use the exact same API Key from your ESP32 code
        const API_KEY = "AIzaSyCQ7aAWm57nQULC6AsQJxaK6lJDMwH-0rI";
        const DATABASE_URL = "https://batterydb-85228-default-rtdb.asia-southeast1.firebasedatabase.app/telemetry.json";
        
        let authToken = "";
        let map, marker;
        let fetchInterval;

        // --- 1. Authentication Logic ---
        async function attemptLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');
            const loginBtn = document.querySelector('button');
            
            loginBtn.innerText = "Authenticating...";

            try {
                // Call Firebase Authentication REST API
                const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`, {
                    method: 'POST',
                    body: JSON.stringify({ email: email, password: password, returnSecureToken: true }),
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (data.idToken) {
                    // Success! Save token and transition UI
                    authToken = data.idToken;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.body.classList.remove('justify-center'); // Adjust layout for dashboard
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    document.getElementById('dashboard-screen').classList.add('flex');
                    
                    initializeMap();
                    fetchFirebaseData();
                    fetchInterval = setInterval(fetchFirebaseData, 5000); // Start polling
                } else {
                    throw new Error("Invalid login");
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                loginBtn.innerText = "Login";
            }
        }

        // --- 2. Map Initialization ---
        function initializeMap() {
            map = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            marker = L.marker([0, 0]).addTo(map);
        }

        // --- 3. Secure Data Fetching ---
        async function fetchFirebaseData() {
            try {
                // Append the secure auth token to the database URL
                const secureUrl = `${DATABASE_URL}?auth=${authToken}`;
                const response = await fetch(secureUrl);
                const data = await response.json();
                
                if (data) {
                    document.getElementById('voltage-display').innerText = (data.voltage || 0).toFixed(2) + ' V';
                    if (data.button_count !== undefined) document.getElementById('count-display').innerText = data.button_count;
                    if (data.satellites !== undefined) document.getElementById('sat-display').innerText = data.satellites;

                    if (data.latitude && data.longitude && data.latitude !== 0 && data.longitude !== 0) {
                        document.getElementById('lat-display').innerText = data.latitude.toFixed(6);
                        document.getElementById('lng-display').innerText = data.longitude.toFixed(6);
                        
                        const newPos = [data.latitude, data.longitude];
                        marker.setLatLng(newPos);
                        map.setView(newPos, 15);
                    }
                }
            } catch (error) {
                console.error("Error fetching secure data:", error);
                // If token expires, reload page to force login
                if (error.message.includes("401") || error.message.includes("Permission denied")) {
                    window.location.reload(); 
                }
            }
        }
    </script>
</body>
</html>
